  <main id="main" tabindex="-1">
    <header class="intro"><p class="eyebrow">数学与物理 · 中文阅读</p><h1>书籍翻译中心</h1><p>找一本书，看看是否已有译稿或中文版本。</p></header>
    <form id="search-form" role="search">
      <label for="book-search">书名或作者</label>
      <div class="search-box"><span aria-hidden="true">⌕</span><input type="search" id="book-search" placeholder="中文名、英文名、作者或 GTM 编号" autocomplete="off" aria-controls="book-list"><button id="clear-search" type="button" hidden>清除</button></div>
    </form>
    <div class="browse"><div class="filters" role="group" aria-label="译本类型"><button type="button" data-filter="all" aria-pressed="true">全部</button><button type="button" data-filter="mine" aria-pressed="false">已有译稿</button><button type="button" data-filter="chinese" aria-pressed="false">已查到中文版</button></div><p id="results-status" role="status" aria-live="polite">正在载入书目…</p></div>
    <div id="book-list" class="book-list"></div>
    <div id="empty-state" class="empty-state" hidden><h2>没有匹配的书目</h2><p>试试原文书名、作者姓氏或更短的关键词。当前目录未收录，不代表没有中文译本。</p><button type="button" id="reset-search">查看全部书目</button></div>
    <div id="load-error" class="empty-state" hidden><h2>书目暂时未能载入</h2><p>请检查网络后重试。</p><button type="button" id="retry-load">重新载入</button></div>
    <noscript><p>请开启 JavaScript 使用书目查找。</p></noscript>
    <footer><p>“已有译稿”包含进行中的翻译；具体进度见书目。“已查到中文版”来自 Z-Library 书目核查，不表示本站提供该版本。</p><p>书目更新：<time id="updated">—</time> · <a href="../">回到首页</a></p></footer>
